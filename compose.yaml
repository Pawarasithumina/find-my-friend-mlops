
services:

  # ==========================================
  # SERVICE 1: RUSTFS OBJECT STORAGE
  # ==========================================
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set access key}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set secret key}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "error"

    volumes:
      - rustfs_data:/data

    command: ["/data"]


  # ==========================================
  # SERVICE 2: POSTGRESQL DATABASE
  # ==========================================
  postgres:
    image: postgres:17
    restart: unless-stopped

    ports:
      - "127.0.0.1:5433:5432"

    environment:
      POSTGRES_USER: faceops_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set password}
      POSTGRES_DB: faceops_db

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================================
  # SERVICE 3: MLFLOW TRACKING SERVER
  # ==========================================
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow

    restart: unless-stopped

    ports:
      - "127.0.0.1:5050:5000"

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set password}

      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?Set access key}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set secret key}
      AWS_DEFAULT_REGION: us-east-1

      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000

    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

    command: >-
      sh -ec 'exec mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri
      "postgresql+psycopg2://faceops_admin:$${POSTGRES_PASSWORD}@postgres:5432/mlflow_db"
      --artifacts-destination
      s3://faceops-mlflow/artifacts
      --serve-artifacts
      --allowed-hosts
      "localhost:*,127.0.0.1:*,mlflow:*"'


    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


# ==========================================
# PERSISTENT DOCKER VOLUMES
# ==========================================
volumes:
  rustfs_data:
  postgres_data:

